name: Update Travel Cost Index

# Phase 13.5c automation. Monthly (this dataset is annual/periodic — not
# worth checking daily) + manual dispatch for on-demand verification.
# Fetches the World Bank Indicators API, validates the result through
# the same pipeline app/scripts/lib/travelCostIndexIngest.mjs is
# unit-tested against, and — ONLY if the snapshot actually changed and
# validation passed — opens a pull request with the diff. Never pushes
# directly to claude/marhaba-kxry8l: a human still reviews and merges.
# No third-party Action beyond first-party actions/checkout and
# actions/setup-node (same two this repo's existing deploy-pages.yml
# already uses) — PR creation uses the `gh` CLI, which ships preinstalled
# on GitHub-hosted runners and authenticates with the built-in
# GITHUB_TOKEN, so no new secret/PAT is needed.
on:
  schedule:
    - cron: '0 3 1 * *' # 03:00 UTC on the 1st of each month
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: travel-cost-index-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run ingestion pipeline tests (fixtures only, no network)
        working-directory: app
        run: npx vitest run scripts/lib/travelCostIndexIngest.test.mjs src/data/travelCostIndex.test.ts

      # The only network-touching step in this whole workflow. Exits
      # non-zero on ANY failure (fetch, malformed response, insufficient
      # coverage, an excluded country somehow present) and — per
      # generate-travel-cost-index.mjs's own atomic-write design — never
      # touches the committed snapshot file in that case. A failed run
      # here fails the whole job; no later step executes; nothing is
      # committed or opened.
      - name: Generate travel cost index snapshot
        working-directory: app
        run: node scripts/generate-travel-cost-index.mjs

      - name: Upload generated snapshot (verification artifact)
        uses: actions/upload-artifact@v4
        with:
          name: travel-cost-index-snapshot
          path: app/src/data/generated/travelCostIndex.json
          retention-days: 14

      - name: Check whether the snapshot actually changed
        id: diff
        working-directory: app
        run: |
          if git diff --quiet -- src/data/generated/travelCostIndex.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Always a brand-new branch per run (never force-pushed, never
      # reused) — a PR is the only way this workflow ever changes the
      # repository; it never pushes to claude/marhaba-kxry8l directly.
      - name: Open a pull request with the updated snapshot
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="update-travel-cost-index-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/data/generated/travelCostIndex.json
          git commit -m "chore: update travel cost index snapshot"
          git push origin "$BRANCH"
          gh pr create \
            --base claude/marhaba-kxry8l \
            --head "$BRANCH" \
            --title "chore: update travel cost index snapshot" \
            --body "Automated update from the World Bank Indicators API (indicator PA.NUS.PPPC.RF), generated by scripts/generate-travel-cost-index.mjs and validated by its own pipeline before this PR was opened. Review the diff, then merge normally."
