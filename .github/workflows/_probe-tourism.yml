name: PROBE - tourism indicator liveness (temporary, deleted after use)
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe ST.INT.ARVL (international tourist arrivals), USA, mrv=6
        run: |
          echo "--- ST.INT.ARVL, USA, mrv=6 ---"
          curl -sS "https://api.worldbank.org/v2/country/USA/indicator/ST.INT.ARVL?format=json&mrv=6" | head -c 2000
          echo
          echo "--- ST.INT.ARVL, FRA, mrv=6 ---"
          curl -sS "https://api.worldbank.org/v2/country/FRA/indicator/ST.INT.ARVL?format=json&mrv=6" | head -c 1500
          echo
      - name: Probe ST.INT.RCPT.CD (international tourism receipts, current US$), USA, mrv=6
        run: |
          echo "--- ST.INT.RCPT.CD, USA, mrv=6 ---"
          curl -sS "https://api.worldbank.org/v2/country/USA/indicator/ST.INT.RCPT.CD?format=json&mrv=6" | head -c 2000
          echo
      - name: Probe all-countries recent arrivals (coverage sample)
        run: |
          echo "--- ST.INT.ARVL, all countries, mrv=1, per_page=20 (sample) ---"
          curl -sS "https://api.worldbank.org/v2/country/all/indicator/ST.INT.ARVL?format=json&mrv=1&per_page=20" | head -c 3000
          echo
