name: Production smoke test

# Phase 20 — read-only check of the deployed GitHub Pages site from a
# GitHub-hosted runner (the development sandbox cannot reach github.io).
# Manual dispatch only. The script blocks every Worker request inside the
# browser, so a run writes nothing to production data.
on:
  workflow_dispatch:
    inputs:
      site:
        description: 'Site URL to check'
        required: false
        default: 'https://hmooodzozo577-gif.github.io/wej'
      engines:
        description: 'Browser engines (comma-separated: chromium,firefox,webkit,msedge)'
        required: false
        default: 'chromium,firefox,webkit,msedge'
      safari:
        description: 'Also check real Safari on a macOS runner (Worker blocked; writes no data)'
        type: boolean
        required: false
        default: true
      ios:
        description: 'Also run the Safari checks in an iOS Simulator (Mobile Safari; Worker blocked; writes no data)'
        type: boolean
        required: false
        default: true
      voiceover:
        description: 'Also run a VoiceOver smoke test on a destination page (macOS runner; writes no data)'
        type: boolean
        required: false
        default: true
      worker_checks:
        description: 'Also check the Worker hardening (rate limits, CORS, input handling; writes no data)'
        type: boolean
        required: false
        default: true
      admin_checks:
        description: 'Also check the private admin surface (read-only, no credentials, writes no data)'
        type: boolean
        required: false
        default: true

# No workflow-wide token scope; the job declares read-only access.
permissions: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install Playwright (runner only, not a project dependency)
        working-directory: app
        run: |
          npm install --no-save --no-package-lock playwright@1
          npx playwright install --with-deps chromium firefox webkit
          # Real Microsoft Edge: use the runner's own install when present.
          if ! command -v microsoft-edge-stable >/dev/null 2>&1; then npx playwright install msedge; fi
          microsoft-edge-stable --version || true

      - name: Run the smoke test
        working-directory: app
        env:
          SITE: ${{ inputs.site }}
          ENGINES: ${{ inputs.engines }}
        run: |
          case "$SITE" in
            https://hmooodzozo577-gif.github.io/wej|https://hmooodzozo577-gif.github.io/wej/) ;;
            *) echo "::error::Unsupported site URL"; exit 1 ;;
          esac
          if ! printf '%s' "$ENGINES" | grep -Eq '^(chromium|firefox|webkit|msedge)(,(chromium|firefox|webkit|msedge))*$'; then
            echo "::error::Unsupported engines list"; exit 1
          fi
          node scripts/production-smoke.mjs "$SITE" "$ENGINES"

      - name: Check the Worker hardening (no data written)
        if: ${{ !cancelled() && inputs.worker_checks }}
        working-directory: app
        run: node scripts/worker-smoke.mjs

      - name: Check the admin surface (read-only, no credentials)
        if: ${{ !cancelled() && inputs.admin_checks }}
        working-directory: app
        run: node scripts/admin-smoke.mjs

  # Real Safari (macOS desktop) through Apple's safaridriver. The Worker's
  # hostname is mapped to 127.0.0.1 first, so nothing reaches production
  # data. iOS Safari is not covered.
  safari:
    if: ${{ inputs.safari }}
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Block the Worker (IPv4 and IPv6) and prove it is unreachable
        run: |
          printf '127.0.0.1 wejhaty-travel-worker.hmooodzozo577.workers.dev\n::1 wejhaty-travel-worker.hmooodzozo577.workers.dev\n' | sudo tee -a /etc/hosts
          sudo dscacheutil -flushcache
          sudo killall -HUP mDNSResponder || true
          sleep 2
          if curl -sS --max-time 8 -o /dev/null https://wejhaty-travel-worker.hmooodzozo577.workers.dev/api/intelligence/SA/tourism; then
            echo "::error::The Worker is still reachable; stopping so this run cannot write production data."; exit 1
          fi
          echo "Worker unreachable from this runner, as intended."

      - name: Enable safaridriver
        run: sudo safaridriver --enable

      - name: Install the WebDriver client (runner only, not a project dependency)
        working-directory: app
        run: npm install --no-save --no-package-lock selenium-webdriver@4

      - name: Run the Safari smoke test
        working-directory: app
        env:
          SITE: ${{ inputs.site }}
        run: |
          case "$SITE" in
            https://hmooodzozo577-gif.github.io/wej|https://hmooodzozo577-gif.github.io/wej/) ;;
            *) echo "::error::Unsupported site URL"; exit 1 ;;
          esac
          node scripts/safari-smoke.mjs "$SITE"

  # Mobile Safari in an iOS Simulator: the real Safari app on simulated iOS
  # (not a physical device), driven by the same checks through safaridriver.
  ios:
    if: ${{ inputs.ios }}
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Block the Worker (IPv4 and IPv6) and prove it is unreachable
        run: |
          printf '127.0.0.1 wejhaty-travel-worker.hmooodzozo577.workers.dev\n::1 wejhaty-travel-worker.hmooodzozo577.workers.dev\n' | sudo tee -a /etc/hosts
          sudo dscacheutil -flushcache
          sudo killall -HUP mDNSResponder || true
          sleep 2
          if curl -sS --max-time 8 -o /dev/null https://wejhaty-travel-worker.hmooodzozo577.workers.dev/api/intelligence/SA/tourism; then
            echo "::error::The Worker is still reachable; stopping so this run cannot write production data."; exit 1
          fi
          echo "Worker unreachable from this runner, as intended."

      - name: Enable safaridriver
        run: sudo safaridriver --enable

      - name: Boot an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(dev['udid'] for rt, devs in sorted(d.items(), reverse=True) if 'iOS' in rt for dev in devs if dev['name'].startswith('iPhone')))")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl list devices | grep "$UDID"
          # Safari's WebDriver needs Remote Automation (Settings > Safari >
          # Advanced) on the device; it is off on a fresh simulator.
          for domain in com.apple.mobilesafari com.apple.WebUI; do
            for key in RemoteAutomationEnabled WebKitRemoteAutomationEnabled WebKitDeveloperExtras; do
              xcrun simctl spawn "$UDID" defaults write "$domain" "$key" -bool YES || true
            done
          done
          # Open Mobile Safari once so it is running (and registered for
          # remote automation) before the WebDriver session asks for it.
          # about:blank only: nothing from the site loads here.
          xcrun simctl openurl "$UDID" about:blank || true
          sleep 10
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Install the WebDriver client (runner only, not a project dependency)
        working-directory: app
        run: npm install --no-save --no-package-lock selenium-webdriver@4

      - name: Run the Safari smoke test on iOS
        working-directory: app
        env:
          SITE: ${{ inputs.site }}
          IOS_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          case "$SITE" in
            https://hmooodzozo577-gif.github.io/wej|https://hmooodzozo577-gif.github.io/wej/) ;;
            *) echo "::error::Unsupported site URL"; exit 1 ;;
          esac
          node scripts/safari-smoke.mjs "$SITE"

      - name: Screenshot of Home and a destination in Mobile Safari
        if: ${{ always() && steps.sim.outputs.udid }}
        env:
          SITE: ${{ inputs.site }}
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          case "$SITE" in
            https://hmooodzozo577-gif.github.io/wej|https://hmooodzozo577-gif.github.io/wej/) ;;
            *) echo "::error::Unsupported site URL"; exit 1 ;;
          esac
          SITE="${SITE%/}"
          xcrun simctl openurl "$UDID" "$SITE/"
          sleep 25
          xcrun simctl io "$UDID" screenshot ios-safari-home.png
          xcrun simctl openurl "$UDID" "$SITE/destination/japan"
          sleep 20
          xcrun simctl io "$UDID" screenshot ios-safari-destination.png

      - name: Keep the screenshot
        if: ${{ always() && steps.sim.outputs.udid }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-safari-screenshots
          path: ios-safari-*.png
          retention-days: 7

  # Real VoiceOver on a macOS runner (Guidepup drives it): moves through a
  # destination page by headings and checks what is actually announced.
  voiceover:
    if: ${{ inputs.voiceover }}
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Block the Worker (IPv4 and IPv6) and prove it is unreachable
        run: |
          printf '127.0.0.1 wejhaty-travel-worker.hmooodzozo577.workers.dev\n::1 wejhaty-travel-worker.hmooodzozo577.workers.dev\n' | sudo tee -a /etc/hosts
          sudo dscacheutil -flushcache
          sudo killall -HUP mDNSResponder || true
          sleep 2
          if curl -sS --max-time 8 -o /dev/null https://wejhaty-travel-worker.hmooodzozo577.workers.dev/api/intelligence/SA/tourism; then
            echo "::error::The Worker is still reachable; stopping so this run cannot write production data."; exit 1
          fi
          echo "Worker unreachable from this runner, as intended."

      - name: Prepare VoiceOver
        # Environment setup drives System Settings through UI automation and
        # can time out on a slow runner ("Failed to enable Do not disturb").
        # Setup alone is retried, at most three times; the test never is.
        run: |
          for attempt in 1 2 3; do
            if npx --yes @guidepup/setup@0.25.3 setup --ci; then exit 0; fi
            echo "VoiceOver setup attempt $attempt failed; retrying"
            sleep 20
          done
          exit 1

      - name: Install Guidepup (runner only, not a project dependency)
        working-directory: app
        run: |
          npm install --no-save --no-package-lock @guidepup/guidepup@0.34.0
          npx --yes @guidepup/setup@0.25.3 install

      - name: Run the VoiceOver smoke test
        working-directory: app
        env:
          SITE: ${{ inputs.site }}
        run: |
          case "$SITE" in
            https://hmooodzozo577-gif.github.io/wej|https://hmooodzozo577-gif.github.io/wej/) ;;
            *) echo "::error::Unsupported site URL"; exit 1 ;;
          esac
          node scripts/voiceover-smoke.mjs "$SITE"
