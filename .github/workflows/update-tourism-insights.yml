name: Update Tourism Insights

# Phase 13.5d automation. Mirrors update-travel-cost-index.yml's exact
# structure and safety properties (same reusable pattern, deliberately
# not merged into one file since they build two independent snapshots
# with their own tests/concurrency scope) — monthly, even though the
# underlying World Bank tourism indicators (ST.INT.ARVL, ST.INT.RCPT.CD)
# are frozen at 2020 and rarely change, so a fresh check now and then
# costs little and catches it immediately if World Bank ever resumes
# publishing. Fetches, validates through
# app/scripts/lib/tourismInsightsIngest.mjs's own tested pipeline, and —
# ONLY if the snapshot actually changed and validation passed — pushes a
# fresh branch and attempts a PR. Never pushes directly to
# claude/marhaba-kxry8l. No third-party Action beyond first-party
# checkout/setup-node/upload-artifact; PR creation uses the preinstalled
# `gh` CLI with the built-in GITHUB_TOKEN, no new secret/PAT.
on:
  schedule:
    - cron: '0 4 1 * *' # 04:00 UTC on the 1st of each month (offset from the travel-cost-index job at 03:00)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tourism-insights-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run ingestion pipeline tests (fixtures only, no network)
        working-directory: app
        run: npx vitest run scripts/lib/tourismInsightsIngest.test.mjs src/data/tourismInsights.test.ts

      # The only network-touching step. Exits non-zero on ANY failure
      # (fetch, malformed response, insufficient coverage, an excluded
      # country somehow present) and — per generate-tourism-insights.mjs's
      # atomic-write design — never touches the committed snapshot in
      # that case.
      - name: Generate tourism insights snapshot
        working-directory: app
        run: node scripts/generate-tourism-insights.mjs

      - name: Upload generated snapshot (verification artifact)
        uses: actions/upload-artifact@v4
        with:
          name: tourism-insights-snapshot
          path: app/src/data/generated/tourismInsights.json
          retention-days: 14

      - name: Check whether the snapshot actually changed
        id: diff
        working-directory: app
        run: |
          if git diff --quiet -- src/data/generated/tourismInsights.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Always a brand-new branch per run, split from PR-creation for the
      # same reason as update-travel-cost-index.yml: a snapshot pushed
      # with no PR opened is a genuinely incomplete update and must fail
      # (red), never a misleading green.
      - name: Commit and push the updated snapshot to a new branch
        if: steps.diff.outputs.changed == 'true'
        id: push_branch
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="update-tourism-insights-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/data/generated/tourismInsights.json
          git commit -m "chore: update tourism insights snapshot"
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open a pull request with the updated snapshot
        if: steps.diff.outputs.changed == 'true'
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # set +e: see update-travel-cost-index.yml's identical comment
          # — GitHub Actions runs steps under `bash -e` by default, which
          # would otherwise skip every diagnostic line below on the
          # first failing command.
          set +e
          BRANCH="${{ steps.push_branch.outputs.branch }}"
          pr_output=$(gh pr create \
            --base claude/marhaba-kxry8l \
            --head "$BRANCH" \
            --title "chore: update tourism insights snapshot" \
            --body "Automated update from the World Bank Indicators API (ST.INT.ARVL, ST.INT.RCPT.CD), generated by scripts/generate-tourism-insights.mjs and validated by its own pipeline before this PR was opened. Review the diff, then merge normally." 2>&1)
          pr_status=$?
          echo "$pr_output"
          if [ "$pr_status" -eq 0 ]; then
            echo "Snapshot generation: SUCCEEDED. Branch push: SUCCEEDED. Pull request: OPENED."
            exit 0
          fi
          if echo "$pr_output" | grep -qi "not permitted to create or approve pull requests"; then
            echo "::error::Snapshot generation SUCCEEDED and branch '$BRANCH' was pushed with the real, validated update — but PR creation is BLOCKED by a repository setting, not a code or data problem. Required fix (one-time, by a repo admin): Settings -> Actions -> General -> Workflow permissions -> check 'Allow GitHub Actions to create and approve pull requests'. Until that is enabled, this job correctly reports FAILURE (an incomplete update path), not success — the branch above still holds the real update for manual PR creation in the meantime."
            exit 1
          fi
          echo "::error::Snapshot generation SUCCEEDED and branch '$BRANCH' was pushed, but pull request creation failed for an UNRECOGNIZED reason (see gh output above) — this needs investigation, not just a repository-setting fix."
          exit 1
