name: Official source probe (temporary research)

# Temporary, read-only research job for Phase 19. The Claude sandbox's
# egress policy blocks these official domains, so a GitHub-hosted runner
# fetches each page once and prints its visible text to this job's log for
# review. Nothing is committed, uploaded or deployed. Removed after the
# research round.
on:
  push:
    branches: [claude/marhaba-kxry8l]
    paths:
      - '.github/workflows/official-source-probe.yml'
      - '.github/probe/**'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and print official pages
        shell: python
        run: |
          import html, json, re, time, urllib.request
          from html.parser import HTMLParser

          class Text(HTMLParser):
              def __init__(self):
                  super().__init__(); self.out = []; self.skip = 0
              def handle_starttag(self, tag, attrs):
                  if tag in ('script', 'style', 'noscript'): self.skip += 1
                  if tag in ('p', 'li', 'tr', 'br', 'h1', 'h2', 'h3', 'h4', 'div', 'td', 'th'): self.out.append('\n')
              def handle_endtag(self, tag):
                  if tag in ('script', 'style', 'noscript') and self.skip: self.skip -= 1
              def handle_data(self, data):
                  if not self.skip: self.out.append(data)

          for item in json.load(open('.github/probe/urls.json')):
              print(f"\n===== BEGIN {item['id']} {item['url']}")
              try:
                  headers = {'User-Agent': 'WejhatyResearch/1.0 (+https://hmooodzozo577-gif.github.io/wej/)', 'Accept': item.get('accept', 'text/html,application/json')}
                  if item.get('lang'): headers['Accept-Language'] = item['lang']
                  req = urllib.request.Request(item['url'], headers=headers)
                  with urllib.request.urlopen(req, timeout=30) as res:
                      body = res.read(3_000_000)
                      if body[:2] == b'\x1f\x8b':
                          import gzip; body = gzip.decompress(body)
                      raw = body.decode('utf-8', 'replace')
                      print(f"STATUS {res.status} FINAL {res.geturl()} BYTES {len(raw)}")
              except Exception as e:
                  print(f"ERROR {type(e).__name__}: {e}")
                  continue
              if item.get('raw'):
                  for line in raw[: item.get('chars', 3000)].split('\n'): print('| ' + line[:220])
                  print(f"===== END {item['id']}"); continue
              if item.get('links'):
                  seen = set()
                  for href, label in re.findall(r'<a[^>]+href="([^"]+)"[^>]*>(.*?)</a>', raw, re.S):
                      label = re.sub(r'<[^>]+>', ' ', label); label = re.sub(r'\s+', ' ', html.unescape(label)).strip()
                      if (re.search(item['links'], href) or re.search(item['links'], label)) and href not in seen:
                          seen.add(href); print('| LINK ' + href[:200] + ' :: ' + label[:120])
                  print(f"===== END {item['id']}"); continue
              if raw.lstrip().startswith('{'):
                  try:
                      data = json.loads(raw)
                      body = (data.get('details') or {}).get('body') or ''
                      print('JSON title:', data.get('title'), '| updated:', data.get('public_updated_at'))
                      raw = body or raw
                  except Exception:
                      pass
              p = Text(); p.feed(raw)
              text = re.sub(r'[ \t\r\f\v]+', ' ', html.unescape(''.join(p.out)))
              text = re.sub(r'\n\s*\n+', '\n', text)
              anchor = item.get('anchor')
              if anchor and anchor in text:
                  # Prefer the LAST navigation-free occurrence: menus repeat
                  # page titles near the top.
                  idx = [m.start() for m in re.finditer(re.escape(anchor), text)]
                  text = text[idx[-1] if len(idx) > 1 and item.get('lastAnchor') else idx[0]:]
              text = text[: item.get('chars', 6000)]
              for line in text.split('\n'):
                  line = line.strip()
                  while line:
                      print('| ' + line[:220]); line = line[220:]
              print(f"===== END {item['id']}")
              time.sleep(1)
