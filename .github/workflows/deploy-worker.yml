name: Deploy Cloudflare Worker

on:
  workflow_dispatch: {}
  push:
    branches: [claude/marhaba-kxry8l]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        working-directory: worker
        run: npm ci

      - name: Typecheck
        working-directory: worker
        run: npm run typecheck

      - name: Test
        working-directory: worker
        run: npm test

      - name: Provision product-data resources
        id: product_resources
        continue-on-error: true
        working-directory: worker
        shell: bash
        run: |
          npx wrangler d1 list --json > d1-list.json
          DB_ID="$(node -e "const fs=require('fs');const rows=JSON.parse(fs.readFileSync('d1-list.json','utf8'));process.stdout.write(rows.find(x=>x.name==='wejhaty-product-data')?.uuid||'')")"
          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create wejhaty-product-data --location apac
            npx wrangler d1 list --json > d1-list.json
            DB_ID="$(node -e "const fs=require('fs');const rows=JSON.parse(fs.readFileSync('d1-list.json','utf8'));process.stdout.write(rows.find(x=>x.name==='wejhaty-product-data')?.uuid||'')")"
          fi
          test -n "$DB_ID"
          cp wrangler.toml wrangler.ci.toml
          cat >> wrangler.ci.toml <<EOF

          [[d1_databases]]
          binding = "PRODUCT_DB"
          database_name = "wejhaty-product-data"
          database_id = "$DB_ID"
          migrations_dir = "migrations"

          [[r2_buckets]]
          binding = "FEEDBACK_SCREENSHOTS"
          bucket_name = "wejhaty-feedback-screenshots"
          EOF
          if ! R2_OUTPUT="$(npx wrangler r2 bucket create wejhaty-feedback-screenshots --location apac 2>&1)"; then
            echo "$R2_OUTPUT"
            [[ "$R2_OUTPUT" == *"already exists"* ]]
          fi
          npx wrangler d1 migrations apply PRODUCT_DB --remote --config wrangler.ci.toml

      - name: Deploy Wejhaty Worker with product data
        if: steps.product_resources.outcome == 'success'
        working-directory: worker
        run: npx wrangler deploy --config wrangler.ci.toml --keep-vars

      - name: Deploy Wejhaty Worker without unavailable product-data bindings
        if: steps.product_resources.outcome == 'failure'
        working-directory: worker
        run: npx wrangler deploy --keep-vars

      - name: Report product-data provisioning failure
        if: steps.product_resources.outcome == 'failure'
        run: |
          echo "Worker code was deployed, but D1/R2 provisioning failed."
          echo "Update CLOUDFLARE_API_TOKEN with D1, R2, and Workers edit permissions, then re-run this workflow."
          exit 1
