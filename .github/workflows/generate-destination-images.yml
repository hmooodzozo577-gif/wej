name: Generate Destination Images

# Destination Imagery System — manual, network-enabled ingestion run.
# Claude's own sandbox denies commons.wikimedia.org/upload.wikimedia.org
# by organization egress policy (confirmed live, not assumed); a
# GitHub-hosted runner has normal internet access, so this workflow is
# the actual execution environment for scripts/generate-destination-images.mjs
# (discovery -> license validation -> selection -> country-relevance ->
# duplicate check -> download -> sharp optimization -> manifest).
#
# Originally designed to NOT commit anything itself (contents: read
# only, artifact hand-off for a human/Claude session to review and
# commit explicitly) — but the Claude sandbox that drives this workflow
# turns out to be unable to reach either the artifact blob storage or
# the raw-logs endpoint (same organization egress allowlist that blocks
# Wikimedia directly), so the artifact hand-off path is not actually
# usable from that side. Falls back to the task's own explicitly
# authorized alternative: this workflow commits and pushes the
# generated assets directly to the CURRENT feature branch only, using
# the normal GITHUB_TOKEN (no PAT/external secret). Safe against a
# self-retrigger loop because this workflow is workflow_dispatch-only —
# it never runs on `push`, so its own commit cannot re-trigger it. Never
# force-pushes, never targets main, never rewrites history.
on:
  workflow_dispatch:
    inputs:
      countries:
        description: 'Comma-separated ISO2 codes, or "all" for the full effective catalog'
        required: true
        default: 'SA,FR,JP,BR,ZA,AU'

# No workflow-wide token scope; the one job below asks for exactly what it
# needs (it commits the generated assets to the current branch).
permissions: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # The dispatch input reaches the shell only through this variable —
      # never interpolated into a script — and is validated before any use.
      COUNTRIES: ${{ inputs.countries }}
      REF_NAME: ${{ github.ref_name }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Validate the countries input
        run: |
          if ! printf '%s' "$COUNTRIES" | grep -Eq '^(all|[A-Z]{2}(,[A-Z]{2})*)$'; then
            echo "::error::countries must be \"all\" or comma-separated uppercase ISO2 codes (e.g. SA,FR,JP)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run ingestion
        working-directory: app
        run: |
          if [ "$COUNTRIES" = "all" ]; then
            node scripts/generate-destination-images.mjs --all
          else
            IFS=',' read -ra CODES <<< "$COUNTRIES"
            for code in "${CODES[@]}"; do
              node scripts/generate-destination-images.mjs --country "$code"
            done
          fi

      - name: Report asset size
        working-directory: app
        run: |
          echo "--- Generated assets ---"
          ls -la public/destinations/ 2>/dev/null || echo "(no assets directory — nothing downloaded)"
          du -sh public/destinations/ 2>/dev/null || true
          echo "--- Manifest ---"
          cat src/data/generated/destinationImages.json

      - name: Upload generated assets + manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: destination-images
          path: |
            app/public/destinations/
            app/src/data/generated/destinationImages.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit and push generated assets (branch-scoped, no force)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/public/destinations/ app/src/data/generated/destinationImages.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update generated destination imagery (countries: $COUNTRIES)" \
            -m "Committed by the generate-destination-images workflow run $RUN_ID on $REF_NAME — not authored by a Claude session directly. No PAT, no force-push, this feature branch only."
          git push origin "HEAD:$REF_NAME"
