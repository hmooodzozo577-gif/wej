name: Deploy React app to GitHub Pages

# Builds the React app in app/ and publishes app/dist as the Pages artifact.
# Does NOT switch Pages' Source to "GitHub Actions" by itself — that is a
# separate, manual step in Settings → Pages. Until that switch happens, this
# workflow can run (e.g. on a PR, once triggers are widened) without
# affecting what Pages actually serves.
on:
  push:
    branches: [claude/marhaba-kxry8l]
    paths:
      - 'app/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        run: npm run build

      - name: SPA fallback (404.html = copy of index.html)
        working-directory: app
        run: cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
