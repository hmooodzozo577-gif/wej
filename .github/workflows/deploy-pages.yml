name: Deploy React app to GitHub Pages

# Builds the React app in app/ and publishes app/dist as the Pages artifact.
# Does NOT switch Pages' Source to "GitHub Actions" by itself — that is a
# separate, manual step in Settings → Pages. Until that switch happens, this
# workflow can run (e.g. on a PR, once triggers are widened) without
# affecting what Pages actually serves.
on:
  push:
    branches: [claude/marhaba-kxry8l]
    paths:
      - 'app/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch: {}

# No workflow-wide token scope: the build job reads the repository (and the
# Pages configuration); only the deploy job can publish.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

# Public Worker origin that serves the travel endpoints (one deployed
# Cloudflare Worker, see worker/wrangler.toml's `name`). Prefers a
# repository Variable named WORKER_URL (Settings -> Actions ->
# Variables) if one is ever configured there — the single source of
# truth without editing this file — and falls back to the literal
# origin `deploy-worker.yml`'s own `wrangler deploy` step reported on
# its first real deployment.
env:
  WORKER_URL: ${{ vars.WORKER_URL || 'https://wejhaty-travel-worker.hmooodzozo577.workers.dev' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        run: npm run build
        env:
          VITE_TRAVEL_WORKER_URL: ${{ env.WORKER_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}

      - name: SPA fallback (404.html = copy of index.html)
        working-directory: app
        run: cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
