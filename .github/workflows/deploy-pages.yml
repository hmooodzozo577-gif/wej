name: Deploy React app to GitHub Pages

# Builds the React app in app/ and publishes app/dist as the Pages artifact.
# Does NOT switch Pages' Source to "GitHub Actions" by itself — that is a
# separate, manual step in Settings → Pages. Until that switch happens, this
# workflow can run (e.g. on a PR, once triggers are widened) without
# affecting what Pages actually serves.
on:
  push:
    branches: [claude/marhaba-kxry8l]
    paths:
      - 'app/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The build needs no credentials; leaving the token in .git/config
          # would expose it to anything that runs during install or build.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        # --ignore-scripts stops a dependency's install hook from running with
        # write access to the artifact that is about to be published.
        run: npm ci --ignore-scripts

      - name: Build
        working-directory: app
        # Injects the Content-Security-Policy, emits dist/_headers, and fails
        # if the bundle references any origin other than its own.
        run: npm run build

      - name: SPA fallback (404.html = copy of index.html)
        working-directory: app
        # The copy carries the CSP meta tag too, so a deep link that lands on
        # the fallback is protected exactly like the entry page.
        run: cp dist/index.html dist/404.html

      - name: Refuse to publish without the Content-Security-Policy
        working-directory: app
        run: |
          set -euo pipefail
          for f in dist/index.html dist/404.html; do
            grep -qF "default-src 'none'" "$f" || { echo "::error::$f has no CSP — refusing to deploy"; exit 1; }
          done
          echo "CSP present in both entry documents."

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
