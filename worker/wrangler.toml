# Cloudflare Worker configuration for Wejhaty's travel API.
#
# DEPLOYED via .github/workflows/deploy-worker.yml (see ../README.md):
# real URL https://wejhaty-travel-worker.hmooodzozo577.workers.dev.
# The Amadeus-backed travel route is reachable but AMADEUS_API_KEY/
# AMADEUS_API_SECRET have never been set — see ../README.md.
name = "wejhaty-travel-worker"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Non-secret configuration only. 'production' opts into Amadeus' live API;
# anything else (including leaving this unset) uses the test/sandbox API
# — see ./src/amadeus.ts's resolveAmadeusBaseUrl(). This is intentionally
# NOT a secret: it's a plain mode switch, not a credential, and keeping it
# in [vars] (rather than alongside the two real secrets below) makes an
# accidental production switch visible in a diff of this committed file.
[vars]
AMADEUS_ENV = "test"

[triggers]
crons = ["17 2 * * *"]

# Product-data resources are added here after `wrangler d1 create` and
# `wrangler r2 bucket create` return their real account-scoped identifiers.
# Never commit invented IDs or secret values. See README.md.
# The two real secrets (AMADEUS_API_KEY, AMADEUS_API_SECRET) are NEVER set
# here — see ../SECRETS.md. They are configured out-of-band via:
#   npx wrangler secret put AMADEUS_API_KEY
#   npx wrangler secret put AMADEUS_API_SECRET
# which stores each value encrypted in Cloudflare's platform and injects
# it into `env` at runtime only; neither is ever written to this file,
# this repository, or any build output.

# Security Pass 2 (S1) — per-endpoint abuse limits for the public write
# endpoints, enforced at Cloudflare's edge by the Workers Rate Limiting API.
# Keyed in src/product.ts on the connecting IP address (CF-Connecting-IP),
# never on the client-generated session id. Budgets are per address per
# 60 seconds; a limited request gets 429 with Retry-After. The namespace ids
# are account-local labels, not secrets.
[[ratelimits]]
name = "EVENTS_RATE_LIMITER"
namespace_id = "1901"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "RATINGS_RATE_LIMITER"
namespace_id = "1902"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "FEEDBACK_RATE_LIMITER"
namespace_id = "1903"
simple = { limit = 5, period = 60 }

# Phase 20 security backlog — city descriptions can trigger outbound
# Wikipedia lookups, so the endpoint gets its own per-address budget too.
[[ratelimits]]
name = "CITY_DESCRIPTIONS_RATE_LIMITER"
namespace_id = "1904"
simple = { limit = 60, period = 60 }
