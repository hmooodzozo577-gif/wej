# Cloudflare Worker configuration for Wejhaty's travel API backend.
#
# NOT DEPLOYED as part of this change (Phase 13.3 implements the real
# Amadeus integration but does not deploy it — see ../README.md and the
# final report for the exact manual deployment step). Deploying this
# Worker requires a Cloudflare account and `wrangler login`/API token,
# neither of which this task sets up.
name = "wejhaty-travel-worker"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Non-secret configuration only. 'production' opts into Amadeus' live API;
# anything else (including leaving this unset) uses the test/sandbox API
# — see ./src/amadeus.ts's resolveAmadeusBaseUrl(). This is intentionally
# NOT a secret: it's a plain mode switch, not a credential, and keeping it
# in [vars] (rather than alongside the two real secrets below) makes an
# accidental production switch visible in a diff of this committed file.
[vars]
AMADEUS_ENV = "test"

# The two real secrets (AMADEUS_API_KEY, AMADEUS_API_SECRET) are NEVER set
# here — see ../SECRETS.md. They are configured out-of-band via:
#   npx wrangler secret put AMADEUS_API_KEY
#   npx wrangler secret put AMADEUS_API_SECRET
# which stores each value encrypted in Cloudflare's platform and injects
# it into `env` at runtime only; neither is ever written to this file,
# this repository, or any build output.

# Phase 16 — AI API Integration. Native Cloudflare Workers AI binding:
# makes inference available at `env.AI` with NO API key of any kind —
# see src/ai/cloudflareWorkersAiProvider.ts and ../SECRETS.md's Phase 16
# section for why this is a fundamentally different mechanism from the
# AMADEUS_* secrets above (account-scoped binding, not a bearer
# credential). Present in this file (so `env.AI` resolves once this
# Worker is actually deployed) even though the Worker itself remains
# undeployed today — see the final report's "Deployment Authentication
# State"/"Worker Deployment" sections for the exact remaining manual
# step and why.
[ai]
binding = "AI"
