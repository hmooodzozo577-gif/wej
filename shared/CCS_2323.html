<style>
/* Layout: sticky bar (chapter switch, sections, tools) over topic-coloured cards; one chapter at a time. */
:root {
  --bg: #0c1018; --surface: #141b29; --surface-2: #1a2336; --line: #27324b;
  --fg: #e6ebf5; --muted: #8f9bb6; --accent: #e6b450; --accent-ink: #1a1305; --ok: #6fdc9a;
  --c1: #e6b450; --c2: #f0866f; --c3: #52c7bb; --c4: #8e9cff; --c5: #86cf82;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --font-ar: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 56px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.wrap { max-width: 1040px; margin: 0 auto; }
header.top { padding: 20px 0 12px; display: grid; gap: 4px; }
.kicker { font-family: var(--font-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
h1 { margin: 0; font-size: clamp(24px, 5vw, 36px); line-height: 1.1; font-weight: 700; text-wrap: balance; }
.sub { color: var(--muted); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding: 10px 0 12px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.ch { font: 600 14px var(--font-body); color: var(--muted); background: var(--surface); border: 1px solid var(--line); padding: 8px 14px; border-radius: 10px; cursor: pointer; text-align: left; display: grid; }
.ch small { font-weight: 400; font-size: 11.5px; opacity: .85; }
.ch[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tab { font: 500 13.5px var(--font-body); color: var(--muted); background: transparent; border: 0; border-bottom: 2px solid transparent; padding: 6px 4px; margin-right: 10px; cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline; }
.tab .n { font-family: var(--font-mono); font-size: 11px; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
button:focus-visible, input:focus-visible, .card:focus-visible, [data-r]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.search { flex: 1 1 170px; min-width: 0; font: 400 14px var(--font-body); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.switch { font: 500 13px var(--font-body); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.switch .dot { width: 30px; height: 17px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); position: relative; }
.switch .dot::after { content: ""; position: absolute; top: 2px; left: 2px; width: 11px; height: 11px; border-radius: 50%; background: var(--muted); transition: transform .15s; }
.switch[aria-pressed="true"] .dot { background: var(--accent); border-color: var(--accent); }
.switch[aria-pressed="true"] .dot::after { transform: translateX(13px); background: var(--accent-ink); }
.progress { display: flex; gap: 10px; align-items: center; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.meter { width: 90px; height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .2s; }
.chip { font: 500 12.5px var(--font-body); color: var(--muted); background: transparent; border: 1px solid var(--line); padding: 5px 11px; border-radius: 999px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.chip[aria-pressed="true"] { color: var(--fg); background: var(--surface-2); border-color: var(--muted); }
main { padding-top: 16px; }
.hint { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 10px; align-items: start; }
.sec-title { display: flex; align-items: center; gap: 10px; margin: 20px 0 10px; font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
.sec-title i { width: 10px; height: 10px; border-radius: 50%; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.def-card { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
.term { font-family: var(--font-mono); font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }
.def { grid-column: 1 / -1; margin-top: 4px; }
.check { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; font-size: 14px; line-height: 1; }
.check[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--accent-ink); }
.def-card.known { opacity: .6; }
.btns { grid-column: 2; grid-row: 1; display: flex; gap: 6px; align-self: start; }
.q { font-family: var(--font-mono); font-size: 13px; font-weight: 600; }
.q[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ex { display: none; grid-column: 1 / -1; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); font-family: var(--font-ar); direction: rtl; text-align: right; font-size: 14.5px; line-height: 1.65; }
.ex.on { display: block; }
.ex small { display: block; color: var(--muted); font-size: 11.5px; margin-bottom: 2px; }
.cmp .ex { margin: 0; padding: 10px 14px 12px; }
.cmp h3 .q { margin-left: auto; width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; line-height: 1; }
.recall .def-card:not(.shown) .ex { filter: blur(7px); user-select: none; }
.recall .def-card { cursor: pointer; }
.recall .def-card:not(.shown) .def { filter: blur(7px); user-select: none; }
.recall [data-r]:not(.shown) { filter: blur(6px); user-select: none; cursor: pointer; }
.cmps { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 10px; align-items: start; }
.cmp { padding: 0; overflow: hidden; }
.cmp.w { grid-column: 1 / -1; }
.cmp h3, .lst h3 { margin: 0; font-size: 14px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
.cmp h3 { padding: 11px 14px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.cmp h3 i, .lst h3 i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 8px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
tr:last-child th, tr:last-child td { border-bottom: 0; }
thead th { font-family: var(--font-mono); font-size: 12px; font-weight: 600; }
tbody th { color: var(--muted); font-weight: 500; white-space: nowrap; width: 1%; }
td + td, th + th { border-left: 1px solid var(--line); }
.lst h3 { margin-bottom: 8px; }
ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; counter-reset: n; }
li { counter-increment: n; display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: baseline; }
li::before { content: counter(n); font-family: var(--font-mono); font-size: 12px; font-weight: 600; color: var(--c); text-align: center; background: var(--surface-2); border-radius: 6px; padding: 1px 0; }
.callout { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; display: grid; gap: 8px; }
.callout h3 { margin: 0; font-size: 15px; display: flex; gap: 10px; align-items: center; }
.callout ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.pill { font-family: var(--font-mono); font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; color: #0c1018; letter-spacing: .05em; }
.pill.in { background: var(--c5); } .pill.out { background: var(--c2); } .pill.na { background: var(--c4); }
.ar { font-family: var(--font-ar); direction: rtl; unicode-bidi: isolate; color: var(--muted); margin: 0 0 12px; }
.empty { color: var(--muted); padding: 24px 0; }
.foot { margin-top: 26px; color: var(--muted); font-size: 12.5px; }
@media (max-width: 560px) { .ch small { display: none; } .ch { padding: 8px 12px; } .bar { gap: 8px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
